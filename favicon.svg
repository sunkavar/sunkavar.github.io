<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Trace/signal line -->
  <polyline points="12,62 28,62 35,42 42,72 50,50 58,58 65,38 72,62 88,62" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Initials -->
  <text x="50" y="56" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">RS</text>
  <!-- Signal dot -->
  <circle cx="82" cy="24" r="6" fill="#4ade80"/>
  <circle cx="82" cy="24" r="10" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.4"/>
</svg>
